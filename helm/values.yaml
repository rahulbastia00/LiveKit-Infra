# ==========================================
# Next.js Client Configuration
# ==========================================
client:
  replicaCount: 1
  image:
    repository: rahulbastia/livekit-client
    tag: "12"
    pullPolicy: IfNotPresent
  service:
    port: 3000
  env:
    LIVEKIT_URL: "ws://localhost:7880"
    NEXT_PUBLIC_LK_SERVER_URL: "ws://localhost:7880"
    LIVEKIT_API_KEY: "devkey"
    LIVEKIT_API_SECRET: "534e0f2e83341cbc1af037a564717c47bb6843a0995bf04da27f2a0c01324ebe"
    NEXT_PUBLIC_SHOW_SETTINGS_MENU: "true"

# ==========================================
# LiveKit Server Configuration
# ==========================================
livekit:
  replicaCount: 1
  image:
    repository: livekit/livekit-server
    tag: "v1.8"
    pullPolicy: IfNotPresent
  keys:
    devkey: "534e0f2e83341cbc1af037a564717c47bb6843a0995bf04da27f2a0c01324ebe"
  ports:
    http: 7880
    tcpRtc: 7881
    udpStart: 50000
    udpEnd: 50050
  rtc:
    nodeIp: "127.0.0.1"
    useExternalIp: false

# ==========================================
# Ingress (ALB for HTTP & WebSockets on AWS)
# ==========================================
ingress:
  enabled: false

# ==========================================
# LoadBalancer (NLB for Media on AWS)
# Disabled locally to prevent port collisions with hostNetwork
# ==========================================
loadBalancer:
  enabled: false
