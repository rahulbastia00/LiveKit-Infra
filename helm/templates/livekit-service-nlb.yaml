{{- if and .Values.loadBalancer .Values.loadBalancer.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: livekit-media-lb
spec:
  type: LoadBalancer
  selector:
    app: livekit-server
  ports:
    - name: udp-media
      port: {{ .Values.livekit.ports.udpStart | default 50000 }}
      targetPort: {{ .Values.livekit.ports.udpStart | default 50000 }}
      protocol: UDP
    - name: tcp-signaling
      port: {{ .Values.livekit.ports.http | default 7880 }}
      targetPort: {{ .Values.livekit.ports.http | default 7880 }}
      protocol: TCP
{{- end }}
