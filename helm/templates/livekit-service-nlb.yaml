apiVersion: v1
kind: Service
metadata:
  name: livekit-media-nlb
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "external"
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "instance"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  type: LoadBalancer
  selector:
    app: livekit-server
  ports:
    - name: udp-media
      port: 50000
      targetPort: 50000
      protocol: UDP
    - name: tcp-signaling
      port: 7880
      targetPort: 7880
      protocol: TCP