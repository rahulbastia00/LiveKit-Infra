apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit-server
  labels:
    app: livekit-server
spec:
  replicas: {{ .Values.livekit.replicaCount | default 1 }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: livekit-server
  template:
    metadata:
      labels:
        app: livekit-server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.livekit.ports.prometheus | default 6789 }}"
        prometheus.io/path: "/metrics"
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      restartPolicy: Always
      containers:
        - name: livekit
          image: "{{ .Values.livekit.image.repository }}:{{ .Values.livekit.image.tag }}"
          imagePullPolicy: {{ .Values.livekit.image.pullPolicy | default "IfNotPresent" }}
          command: ["/livekit-server"]
          args: ["--config", "/etc/livekit.yaml"]
          ports:
            - name: http
              containerPort: {{ .Values.livekit.ports.http }}
              protocol: TCP
            - name: tcprtc
              containerPort: {{ .Values.livekit.ports.tcpRtc }}
              protocol: TCP
            - name: udprtc
              containerPort: {{ .Values.livekit.ports.udpStart }}
              protocol: UDP
            - name: metrics
              containerPort: {{ .Values.livekit.ports.prometheus | default 6789 }}
              protocol: TCP
          volumeMounts:
            - name: config-volume
              mountPath: /etc/livekit.yaml
              subPath: livekit.yaml
      volumes:
        - name: config-volume
          configMap:
            name: livekit-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: livekit-config
data:
  livekit.yaml: |
    port: {{ .Values.livekit.ports.http }}
    log_level: info
    prometheus:
      port: {{ .Values.livekit.ports.prometheus | default 6789 }}
    rtc:
      tcp_port: {{ .Values.livekit.ports.tcpRtc }}
      port_range_start: {{ .Values.livekit.ports.udpStart }}
      port_range_end: {{ .Values.livekit.ports.udpEnd }}
      use_external_ip: {{ .Values.livekit.rtc.useExternalIp | default false }}
      node_ip: {{ .Values.livekit.rtc.nodeIp | default "127.0.0.1" | quote }}
    keys:
      {{- range $key, $val := .Values.livekit.keys }}
      {{ $key }}: {{ $val }}
      {{- end }}
