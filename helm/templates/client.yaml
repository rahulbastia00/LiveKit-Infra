apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit-client
  labels:
    app: livekit-client
spec:
  replicas: {{ .Values.client.replicaCount }}
  selector:
    matchLabels:
      app: livekit-client
  template:
    metadata:
      labels:
        app: livekit-client
    spec:
      containers:
        - name: client
          image: "{{ .Values.client.image.repository }}:{{ .Values.client.image.tag }}"
          imagePullPolicy: {{ .Values.client.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.client.service.port }}
          env:
            - name: NEXT_PUBLIC_SHOW_SETTINGS_MENU
              value: "{{ .Values.client.env.NEXT_PUBLIC_SHOW_SETTINGS_MENU }}"
---
apiVersion: v1
kind: Service
metadata:
  name: livekit-client
spec:
  type: NodePort
  selector:
    app: livekit-client
  ports:
    - port: {{ .Values.client.service.port }}
      targetPort: http
      protocol: TCP