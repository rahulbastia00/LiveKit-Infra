services:
  livekit:
    image: livekit/livekit-server:v1.8
    restart: unless-stopped
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        log_level: info
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 50050
          use_external_ip: false
        keys:
          ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}
    ports:
      - "7880:7880/tcp"
      - "7881:7881/tcp"
      - "50000-50050:50000-50050/udp"
    networks:
      - livekit-net

  client:
    image: rahulbastia/livekit-client:latest
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - livekit
    networks:
      - livekit-net

networks:
  livekit-net:
    driver: bridge